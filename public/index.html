<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDPL Readiness Check — Alphavito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EAEFF5; --ink:#14202C; --muted:#56626E; --line:#D7DFE8;
  --navy:#0B1F3A; --orange:#E03D00; --orange-soft:#FFE9DF; --blue:#1366D6; --blue-soft:#E3EEFD;
  --yes:#1366D6; --partial:#B26A00; --no:#C2410C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C141C; --surface:#141F2A; --surface2:#1B2835; --ink:#E6EDF3; --muted:#9AA8B5; --line:#2A3846;
  --navy:#081624; --orange:#FF7A45; --orange-soft:#3A2116; --blue:#5AA2FF; --blue-soft:#14273F;
  --yes:#5AA2FF; --partial:#F0B04A; --no:#FF8A5B; color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0C141C; --surface:#141F2A; --surface2:#1B2835; --ink:#E6EDF3; --muted:#9AA8B5; --line:#2A3846;
  --navy:#081624; --orange:#FF7A45; --orange-soft:#3A2116; --blue:#5AA2FF; --blue-soft:#14273F;
  --yes:#5AA2FF; --partial:#F0B04A; --no:#FF8A5B; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.55}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{background:var(--navy);color:#F3F6FA}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px}
.logo{height:38px;width:auto;background:#FFFFFF;border-radius:8px;padding:5px 8px}
.top .name{font-weight:600;font-size:15px;opacity:.9}
.spacer{flex:1}
.lang{background:transparent;border:1px solid rgba(255,255,255,.35);color:#F3F6FA;border-radius:8px;padding:6px 12px;cursor:pointer}
.hero{background:var(--navy);color:#F3F6FA;padding:28px 0 40px}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.15;margin:0 0 12px;max-width:760px;font-weight:700}
.hero p{margin:0;max-width:680px;color:#C5D2E1;font-size:17px}
.clock{margin-top:22px;display:inline-flex;gap:14px;align-items:baseline;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 16px}
.clock b{font-size:30px;color:#FF8A5B;font-variant-numeric:tabular-nums}
.clock span{color:#C5D2E1;font-size:15px}
.steps{display:flex;gap:8px;margin:-20px 0 22px;flex-wrap:wrap}
.step{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:start;display:flex;gap:10px;align-items:center}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:14px;flex:none}
.step[aria-current="step"]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.step[aria-current="step"] .n{background:var(--blue);color:#fff}
.step .t{font-weight:600}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
fieldset{border:0;margin:0;padding:0}
legend{font-weight:600;font-size:15px;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--bg)}
.seg input{accent-color:var(--blue)}
.toggles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.tg{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);cursor:pointer}
.tg input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.tg b{display:block;font-weight:600}
.tg span{color:var(--muted);font-size:14px}
.notice{border-inline-start:4px solid var(--orange);background:var(--orange-soft);padding:12px 14px;border-radius:8px;margin-top:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:12px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.sec{margin-bottom:18px}
.sec h2{font-size:20px;margin:6px 0 10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px}
.q p{margin:0 0 10px;font-weight:500}
.q .ref{color:var(--muted);font-size:13px;margin-top:8px}
.ans{display:flex;flex-wrap:wrap;gap:8px}
.ans button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.ans button[aria-pressed="true"][data-v="yes"]{background:var(--yes);border-color:var(--yes);color:#fff}
.ans button[aria-pressed="true"][data-v="partial"]{background:var(--partial);border-color:var(--partial);color:#fff}
.ans button[aria-pressed="true"][data-v="no"],.ans button[aria-pressed="true"][data-v="unsure"]{background:var(--no);border-color:var(--no);color:#fff}
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.big{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.band{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact .k{color:var(--muted);font-size:13px}
.fact .v{font-weight:700;font-size:18px}
.rows{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.row{display:grid;grid-template-columns:minmax(150px,240px) 1fr 52px;gap:12px;align-items:center;font-size:15px}
.row .bar{height:10px}
.row b{text-align:end;font-variant-numeric:tabular-nums}
h2.h{font-size:22px;margin:26px 0 10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;border-inline-start:5px solid var(--line)}
.act.p3{border-inline-start-color:var(--no)}.act.p2{border-inline-start-color:var(--partial)}.act.p1{border-inline-start-color:var(--blue)}
.act .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;font-size:13px}
.tag{border-radius:999px;padding:2px 10px;background:var(--surface2);font-weight:600}
.act p{margin:4px 0}
.act .ref{color:var(--muted);font-size:13px}
.cta{background:var(--navy);color:#F3F6FA;border-radius:14px;padding:22px;margin-top:24px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.cta h3{margin:0 0 6px;font-size:20px}
.cta p{margin:0;color:#C5D2E1}
.cta .c{display:flex;gap:18px;flex-wrap:wrap;font-weight:600}
.cta a{color:#FFB38F}
.fine{color:var(--muted);font-size:13px;margin:22px 0 30px}
.empty{color:var(--muted)}
.pkg{display:grid;grid-template-columns:minmax(140px,200px) 1fr;gap:12px;font-size:15px;padding:8px 0;border-top:1px solid var(--line)}
.pkg:first-child{border-top:0}
input[type=email],input[type=tel]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
@media (max-width:640px){.pkg{grid-template-columns:1fr;gap:2px}}
@media (max-width:640px){.score{grid-template-columns:1fr}.row{grid-template-columns:1fr 46px}.row .bar{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<img class="logo" id="logo" alt="Alphavito Technology Solutions">
<span class="name" data-t="brand"></span>
<div class="spacer"></div>
<button class="lang" id="lang" type="button"></button>
</div></header>
<section class="hero"><div class="wrap">
<h1 data-t="h1"></h1>
<p data-t="lead"></p>
<div class="clock" id="clock"></div>
</div></section>
<main class="wrap">
<nav class="steps" aria-label="Steps">
<button class="step" data-go="0" type="button"><span class="n">1</span><span class="t" data-t="s1"></span></button>
<button class="step" data-go="1" type="button"><span class="n">2</span><span class="t" data-t="s2"></span></button>
<button class="step" data-go="2" type="button"><span class="n">3</span><span class="t" data-t="s3"></span></button>
</nav>

<section class="panel" id="p0">
<div class="card">
<div class="grid2">
<label class="f"><span data-t="company"></span><input type="text" id="company" autocomplete="organization"><small data-t="companyHint"></small></label>
<label class="f"><span data-t="sector"></span><select id="sector"></select></label>
<label class="f"><span data-t="records"></span><input type="number" id="records" min="0" step="1000" inputmode="numeric"><small data-t="recordsHint"></small></label>
<fieldset><legend data-t="role"></legend><div class="seg" id="role"></div></fieldset>
</div>
<h2 class="h" data-t="activities" style="margin-top:22px"></h2>
<div class="toggles" id="toggles"></div>
<div id="bankNote"></div>
<div class="actions"><button class="btn primary" type="button" data-go="1" data-t="next1"></button></div>
</div>
</section>

<section class="panel" id="p1">
<div class="progress"><div class="bar"><i id="pbar"></i></div><span id="ptext"></span></div>
<div id="qs"></div>
<div class="actions"><button class="btn ghost" type="button" data-go="0" data-t="back"></button><button class="btn primary" type="button" data-go="2" data-t="next2"></button></div>
</section>

<section class="panel" id="p2">
<div id="results"></div>
</section>

<div class="cta">
<div style="flex:1;min-width:240px"><h3 data-t="ctaH"></h3><p data-t="ctaP"></p></div>
<div class="c"><a href="https://www.alphavito.com" target="_blank" rel="noopener">www.alphavito.com</a><a href="mailto:Sales@alphavito.com">Sales@alphavito.com</a><span dir="ltr">01006527795</span></div>
</div>
<p class="fine" data-t="fine"></p>
</main>
<script>
const SECTIONS = [
 {id:"gov", en:"Licensing and registration", ar:"الترخيص والتسجيل"},
 {id:"dpo", en:"Data Protection Officer", ar:"مسؤول حماية البيانات"},
 {id:"ropa", en:"Data inventory and records", ar:"حصر البيانات والسجلات"},
 {id:"basis", en:"Lawful basis and consent", ar:"الأساس القانوني والموافقة"},
 {id:"trans", en:"Transparency and data lifecycle", ar:"الشفافية ودورة حياة البيانات"},
 {id:"rights", en:"Data subject rights", ar:"حقوق أصحاب البيانات"},
 {id:"sec", en:"Security controls", ar:"ضوابط الأمن"},
 {id:"breach", en:"Breach response", ar:"الاستجابة للخروقات"},
 {id:"vendors", en:"Vendors and transfers abroad", ar:"الموردون والنقل عبر الحدود"},
 {id:"sens", en:"Sensitive and children’s data", ar:"البيانات الحساسة وبيانات الأطفال"},
 {id:"mkt", en:"Electronic direct marketing", ar:"التسويق الإلكتروني المباشر"},
 {id:"cctv", en:"Video surveillance (CCTV)", ar:"كاميرات المراقبة"},
 {id:"web", en:"Website and apps", ar:"المواقع والتطبيقات"},
 {id:"ai", en:"AI and analytics", ar:"الذكاء الاصطناعي والتحليلات"}
];
// w: 3 critical, 2 high, 1 medium. when: applicability on profile.
const QUESTIONS = [
 {id:"q1",s:"gov",w:2,svc:"D1",
  en:"Is your legal entity registered on the PDPC portal (Digital Egypt identity, commercial registration number, authorised signatory)?",
  ar:"هل سجّلت كيانك القانوني على بوابة المركز (هوية مصر الرقمية، رقم السجل التجاري، مفوض بالتوقيع)؟",
  aen:"Create a Digital Egypt identity for the legal representative, open a PDPC portal account and register the entity with its commercial registration number.",
  aar:"أنشئ هوية مصر الرقمية للممثل القانوني، وافتح حسابًا على بوابة المركز، وسجّل الكيان برقم السجل التجاري.",
  ref:"PDPC portal: Register a Legal Entity; ER Art. 36"},
 {id:"q2",s:"gov",w:3,svc:"D1",
  en:"Have you applied for, or obtained, the general PDPC licence (controller/processor, controller or processor)?",
  ar:"هل تقدمت بطلب ترخيص المركز العام (متحكم/معالج، أو متحكم، أو معالج) أو حصلت عليه؟",
  aen:"Complete the portal’s Company Journey questionnaire and submit the general licence file now: decisions take up to 90 working days and silence counts as refusal.",
  aar:"أكمل استبيان رحلة الشركة على البوابة وقدّم ملف الترخيص العام الآن، فالبت قد يستغرق حتى 90 يوم عمل وعدم الرد يُعد رفضًا.",
  ref:"Law Arts. 4(10), 5(11), 26; ER Arts. 2(1), 19, 21, 35–36"},
 {id:"q3",s:"gov",w:3,svc:"D1",when:p=>p.cloud||p.cctv||p.mkt,
  en:"Do you hold the supplementary licences your activities need (cross-border transfer, CCTV, e-marketing)?",
  ar:"هل لديك التراخيص التكميلية التي تتطلبها أنشطتك (النقل عبر الحدود، كاميرات المراقبة، التسويق الإلكتروني)؟",
  aen:"Apply for each supplementary licence after the general one: they are invalid without it.",
  aar:"تقدّم لكل ترخيص تكميلي بعد الترخيص العام، فهي غير سارية بدونه.",
  ref:"Law Arts. 14, 17; ER Arts. 16, 27, 29, 31; Licenses and Permits Guidelines"},
 {id:"q4",s:"gov",w:1,svc:"D1",
  en:"Do you track licence renewal dates and growth in record numbers that would move you to a higher fee tier?",
  ar:"هل تتابع مواعيد تجديد الترخيص وزيادة عدد السجلات التي قد تنقلك إلى شريحة رسوم أعلى؟",
  aen:"Set renewal reminders (licences 3 months before expiry, permits 1 month) and review record counts every quarter.",
  aar:"اضبط تذكيرات التجديد (الترخيص قبل 3 أشهر، والتصريح قبل شهر) وراجع عدد السجلات كل ربع سنة.",
  ref:"ER Arts. 39–40"},
 {id:"q5",s:"dpo",w:3,svc:"D2",
  en:"Have you appointed a DPO registered with the PDPC in the category that matches your record count?",
  ar:"هل عيّنت مسؤول حماية بيانات مقيدًا لدى المركز في الفئة المناسبة لعدد سجلاتك؟",
  aen:"Appoint an internal, external or shared DPO who has passed the PDPC exam for the right category (C, B or A).",
  aar:"عيّن مسؤول حماية داخليًا أو خارجيًا أو مشتركًا اجتاز اختبار المركز للفئة المناسبة (C أو B أو A).",
  ref:"Law Art. 8; ER Arts. 7–9; DPO Categories Guidelines"},
 {id:"q6",s:"dpo",w:2,svc:"D2",
  en:"Is the appointment submitted on the portal with a signed appointment letter, and does the DPO contract guarantee independence?",
  ar:"هل قُدّم التعيين على البوابة بخطاب تعيين موقّع، وهل يضمن عقد مسؤول الحماية استقلاليته؟",
  aen:"Submit the signed appointment letter through Assign DPO and add an independence clause to the DPO contract.",
  aar:"قدّم خطاب التعيين الموقّع عبر خدمة تعيين مسؤول الحماية، وأضف بند الاستقلالية إلى عقده.",
  ref:"ER Art. 21(5); PDPC portal: Assign DPO; DPO Guidelines"},
 {id:"q7",s:"dpo",w:1,svc:"D2",
  en:"Is the DPO’s contact published (for example dpo@yourcompany) and does the DPO report to top management?",
  ar:"هل بيانات التواصل مع مسؤول الحماية منشورة (مثل dpo@company)، وهل يرفع تقاريره للإدارة العليا؟",
  aen:"Publish a generic DPO email in privacy notices and set a direct reporting line to management.",
  aar:"انشر بريدًا عامًا لمسؤول الحماية في إشعارات الخصوصية، وحدد له خط إبلاغ مباشر للإدارة.",
  ref:"Law Art. 9; DPO Guidelines"},
 {id:"q8",s:"dpo",w:2,svc:"D2",
  en:"Does the DPO run periodic assessments and prepare the annual privacy report for the PDPC?",
  ar:"هل يجري مسؤول الحماية تقييمات دورية ويعد التقرير السنوي لحالة الخصوصية للمركز؟",
  aen:"Schedule periodic reviews and the annual privacy-status report; a new DPO must report within 15 days.",
  aar:"جدول المراجعات الدورية والتقرير السنوي، ويقدم المسؤول البديل تقريرًا خلال 15 يومًا.",
  ref:"Law Art. 9(1); ER Art. 12"},
 {id:"q9",s:"ropa",w:2,svc:"A1",
  en:"Do you have a complete inventory of the systems, applications and files that hold personal data?",
  ar:"هل لديك حصر كامل للأنظمة والتطبيقات والملفات التي تحتوي على بيانات شخصية؟",
  aen:"Run an asset inventory and data discovery across servers, SaaS, file shares, endpoints and backups.",
  aar:"نفّذ حصرًا للأصول واكتشافًا للبيانات عبر الخوادم والخدمات السحابية ومجلدات الملفات والأجهزة والنسخ الاحتياطية.",
  ref:"Law Art. 4(9); RoPA Guidelines steps a–e"},
 {id:"q10",s:"ropa",w:3,svc:"A2",when:p=>p.role!=="processor",
  en:"Do you maintain a controller Record of Processing Activities (RoPA)?",
  ar:"هل تحتفظ بسجل أنشطة المعالجة بصفتك متحكمًا؟",
  aen:"Build the RoPA using the PDPC controller template (26 fields) and keep it in a secure electronic register.",
  aar:"أعد سجل المعالجة وفق نموذج المركز للمتحكم (26 حقلًا) واحفظه في سجل إلكتروني مؤمن.",
  ref:"Law Art. 4(9); ER Arts. 2–3; RoPA Guidelines"},
 {id:"q11",s:"ropa",w:3,svc:"A2",when:p=>p.role!=="controller",
  en:"Do you maintain a processor RoPA for the processing you do on behalf of clients?",
  ar:"هل تحتفظ بسجل معالجة بصفتك معالجًا للبيانات التي تعالجها لصالح عملائك؟",
  aen:"Build the processor RoPA (PDPC template, 16 fields) including contracts, transfer routes and deletion dates.",
  aar:"أعد سجل المعالج (نموذج المركز، 16 حقلًا) متضمنًا العقود ومسارات النقل وتواريخ المحو.",
  ref:"Law Art. 5(9); ER Art. 4"},
 {id:"q12",s:"ropa",w:1,svc:"A1",
  en:"Do you know how many personal data records you hold per category?",
  ar:"هل تعرف عدد سجلات البيانات الشخصية لديك لكل فئة؟",
  aen:"Count records per category; the count sets your licence fee tier and DPO category.",
  aar:"احسب السجلات لكل فئة، فالعدد يحدد شريحة رسوم الترخيص وفئة مسؤول الحماية.",
  ref:"ER Art. 19; DPO Categories Guidelines"},
 {id:"q13",s:"basis",w:3,svc:"A2",
  en:"Is a lawful basis documented for every processing activity (consent, contract, legal obligation, legitimate interest, legal claims, court order)?",
  ar:"هل الأساس القانوني موثق لكل نشاط معالجة (موافقة، عقد، التزام قانوني، مصلحة مشروعة، مطالبة قانونية، حكم قضائي)؟",
  aen:"Record the lawful basis per activity in the RoPA; use consent only where people have a real choice.",
  aar:"سجّل الأساس القانوني لكل نشاط في سجل المعالجة، واستخدم الموافقة فقط حين يكون للشخص خيار حقيقي.",
  ref:"Law Art. 6; Lawful Bases Guidelines"},
 {id:"q14",s:"basis",w:2,svc:"C4",
  en:"Where you rely on legitimate interest, have you documented a legitimate interest assessment?",
  ar:"عند الاعتماد على المصلحة المشروعة، هل وثقت تقييمًا للمصلحة المشروعة؟",
  aen:"Run and document an LIA covering legitimacy, necessity and proportionality.",
  aar:"أجرِ ووثّق تقييمًا يغطي المشروعية والضرورة والتناسب.",
  ref:"Law Art. 6(4); Lawful Bases Guidelines"},
 {id:"q15",s:"basis",w:3,svc:"A3",
  en:"Are consent requests in Arabic, opt-in (no pre-ticked boxes), granular per purpose and separate from terms?",
  ar:"هل طلبات الموافقة بالعربية، وبفعل إيجابي (دون مربعات محددة مسبقًا)، ومفصلة لكل غرض، ومنفصلة عن الشروط؟",
  aen:"Redesign consent forms to Consent Guidelines standards and document the mechanism for Center approval.",
  aar:"أعد تصميم نماذج الموافقة وفق إرشادات المركز، ووثّق آلية الموافقة لاعتمادها من المركز.",
  ref:"Law Art. 2; ER Art. 2(2)–(3); Consent Guidelines"},
 {id:"q16",s:"basis",w:2,svc:"A2",
  en:"Are consents recorded in a secure electronic register (who, when, what wording, how, withdrawal)?",
  ar:"هل تُسجَّل الموافقات في سجل إلكتروني مؤمن (من، ومتى، وبأي صيغة، وكيف، والعدول)؟",
  aen:"Store every consent with its date, wording version and form, and log withdrawals.",
  aar:"احفظ كل موافقة بتاريخها وصيغتها وشكلها، وسجّل حالات العدول.",
  ref:"ER Art. 2 (second, 3)"},
 {id:"q17",s:"basis",w:2,svc:"A3",
  en:"Can people withdraw consent as easily as they gave it, with the withdrawal applied in all systems?",
  ar:"هل يستطيع الأشخاص سحب موافقتهم بالسهولة نفسها التي أعطوها بها، مع تطبيق السحب في كل الأنظمة؟",
  aen:"Add a one-step withdrawal option on every channel and sync it to CRM, marketing and third parties.",
  aar:"أضف خيار سحب بخطوة واحدة في كل قناة، وزامنه مع أنظمة العملاء والتسويق والأطراف الأخرى.",
  ref:"Law Art. 2(2); Consent Guidelines"},
 {id:"q18",s:"trans",w:3,svc:"A6",
  en:"Do you give Arabic privacy notices at collection, covering all required items (identity, DPO, purposes, basis, recipients, transfers, retention, rights, complaint to the PDPC)?",
  ar:"هل تقدم إشعارات خصوصية بالعربية عند الجمع تغطي كل العناصر المطلوبة (الهوية، مسؤول الحماية، الأغراض، الأساس، المستلمون، النقل، الاحتفاظ، الحقوق، الشكوى للمركز)؟",
  aen:"Write layered privacy notices per audience (customers, staff, applicants, vendors) and show them at every collection point.",
  aar:"اكتب إشعارات خصوصية متعددة الطبقات لكل فئة (عملاء، موظفون، متقدمون، موردون) واعرضها عند كل نقطة جمع.",
  ref:"Law Art. 2; ER Art. 2 (second, 1); Privacy Notice Guidelines"},
 {id:"q19",s:"trans",w:3,svc:"A5",
  en:"Is there a retention schedule per data category that is enforced, with deletion logs?",
  ar:"هل يوجد جدول احتفاظ لكل فئة بيانات يُطبق فعليًا، مع سجلات للمحو؟",
  aen:"Define retention per category, automate deletion or anonymisation and keep deletion logs.",
  aar:"حدد مدة الاحتفاظ لكل فئة، وأتمت المحو أو إخفاء الهوية، واحتفظ بسجلات المحو.",
  ref:"Law Arts. 3(4), 4(7); ER Art. 3(4)"},
 {id:"q20",s:"trans",w:2,svc:"A1",
  en:"Have you reviewed forms and systems so you collect only the data each purpose needs?",
  ar:"هل راجعت النماذج والأنظمة بحيث تجمع فقط البيانات اللازمة لكل غرض؟",
  aen:"Remove unnecessary fields from forms and stop collecting data you do not use.",
  aar:"احذف الحقول غير الضرورية من النماذج وأوقف جمع البيانات غير المستخدمة.",
  ref:"Law Art. 3; Data Protection Principles Guidelines"},
 {id:"q21",s:"rights",w:3,svc:"A4",
  en:"Do you have a channel and procedure to receive rights requests and reply within 6 working days?",
  ar:"هل لديك قناة وإجراء لتلقي طلبات الحقوق والرد عليها خلال 6 أيام عمل؟",
  aen:"Set up a request form and DPO mailbox with a ticket workflow that tracks the 6-working-day deadline.",
  aar:"أنشئ نموذج طلب وبريدًا لمسؤول الحماية مع نظام تذاكر يتابع مهلة 6 أيام العمل.",
  ref:"Law Arts. 2, 32; ER Art. 3(5)"},
 {id:"q22",s:"rights",w:2,svc:"A4",
  en:"Do you verify the requester’s identity and log every request and its outcome?",
  ar:"هل تتحقق من هوية مقدم الطلب وتسجل كل طلب ونتيجته؟",
  aen:"Add proportionate identity checks and a request log with dates, decisions and reasons.",
  aar:"أضف تحققًا متناسبًا من الهوية وسجلًا للطلبات بالتواريخ والقرارات والأسباب.",
  ref:"ER Art. 3 (second, 5)"},
 {id:"q23",s:"rights",w:2,svc:"A4",
  en:"Can you find, export, correct and delete one person’s data across all your systems?",
  ar:"هل يمكنك العثور على بيانات شخص واحد وتصديرها وتصحيحها ومحوها في كل أنظمتك؟",
  aen:"Map where each data type lives and write runbooks for export, correction and deletion.",
  aar:"حدد مكان كل نوع من البيانات، واكتب إجراءات للتصدير والتصحيح والمحو.",
  ref:"Law Art. 2; Data Users Guidelines"},
 {id:"q24",s:"sec",w:3,svc:"B1",
  en:"Do systems with personal data use multi-factor authentication and role-based access, with periodic access reviews?",
  ar:"هل تستخدم الأنظمة التي بها بيانات شخصية التحقق متعدد العوامل والصلاحيات حسب الدور مع مراجعات دورية؟",
  aen:"Enable MFA, apply least-privilege roles and review access every quarter.",
  aar:"فعّل التحقق متعدد العوامل، وطبق أقل صلاحيات لازمة، وراجع الصلاحيات كل ربع سنة.",
  ref:"Law Arts. 4(6), 5(7); ER Arts. 3–4"},
 {id:"q25",s:"sec",w:3,svc:"B2",
  en:"Is personal data encrypted at rest and in transit, including laptops and backups?",
  ar:"هل البيانات الشخصية مشفرة أثناء التخزين والنقل، بما في ذلك الحواسيب المحمولة والنسخ الاحتياطية؟",
  aen:"Encrypt disks, databases, backups and all transfers; mask data in test systems.",
  aar:"شفّر الأقراص وقواعد البيانات والنسخ الاحتياطية وكل عمليات النقل، وأخفِ البيانات في بيئات الاختبار.",
  ref:"ER Art. 3 (second, 2), Art. 4 (second, 1)"},
 {id:"q26",s:"sec",w:2,svc:"B4",
  en:"Are systems with personal data behind a next-generation firewall, on segmented networks, with secure remote access?",
  ar:"هل الأنظمة التي بها بيانات شخصية محمية بجدار حماية من الجيل التالي وشبكات مقسمة ووصول آمن عن بعد؟",
  aen:"Deploy a next-generation firewall with intrusion prevention, segment database, HR, finance and CCTV networks, and use VPN or zero-trust remote access.",
  aar:"طبّق جدار حماية من الجيل التالي مع منع التسلل، وافصل شبكات قواعد البيانات والموارد البشرية والمالية والكاميرات، واستخدم VPN أو وصولًا بمبدأ انعدام الثقة.",
  ref:"ER Art. 3 (second, 3)"},
 {id:"q27",s:"sec",w:2,svc:"B8",
  en:"Are backups tested regularly, with an offline or immutable copy?",
  ar:"هل تُختبر النسخ الاحتياطية بانتظام مع نسخة غير متصلة أو غير قابلة للتعديل؟",
  aen:"Keep a 3-2-1 backup with an immutable copy and test restores every quarter.",
  aar:"احتفظ بنسخ احتياطية 3-2-1 مع نسخة غير قابلة للتعديل، واختبر الاستعادة كل ربع سنة.",
  ref:"ER Art. 3 (second, 4), Art. 4 (second, 2)"},
 {id:"q28",s:"sec",w:2,svc:"B6",
  en:"Do you collect logs centrally and get alerts that would reveal a breach?",
  ar:"هل تجمع السجلات مركزيًا وتتلقى تنبيهات تكشف أي خرق؟",
  aen:"Centralise logs (SIEM or managed detection) with alerts for mass export and ransomware.",
  aar:"اجمع السجلات مركزيًا (SIEM أو رصد مُدار) مع تنبيهات للتصدير الكبير وبرمجيات الفدية.",
  ref:"Law Art. 7; ER Art. 5"},
 {id:"q29",s:"sec",w:2,svc:"D2",
  en:"Are staff trained on data protection and bound by confidentiality undertakings?",
  ar:"هل الموظفون مدربون على حماية البيانات وموقعون على تعهدات بالسرية؟",
  aen:"Run role-based training, keep attendance records and collect signed confidentiality undertakings.",
  aar:"نفّذ تدريبًا حسب الدور، واحتفظ بسجلات الحضور، واجمع تعهدات السرية الموقعة.",
  ref:"Law Art. 9(8); ER Arts. 2(5), 3(9)"},
 {id:"q30",s:"breach",w:3,svc:"B7",
  en:"Do you have an incident plan to notify the PDPC within 72 hours and affected people within 3 working days?",
  ar:"هل لديك خطة للحوادث لإبلاغ المركز خلال 72 ساعة والأشخاص المتأثرين خلال 3 أيام عمل؟",
  aen:"Write the incident response plan with roles, templates in Arabic and English, and run a drill.",
  aar:"اكتب خطة الاستجابة للحوادث بالأدوار ونماذج بالعربية والإنجليزية، ونفّذ تمرينًا.",
  ref:"Law Art. 7; ER Arts. 5–6"},
 {id:"q31",s:"breach",w:2,svc:"A2",
  en:"Do you keep a secure electronic breach register?",
  ar:"هل تحتفظ بسجل إلكتروني مؤمن للخروقات؟",
  aen:"Log every breach with discovery and report times, cause, volume, impact and corrective action.",
  aar:"سجّل كل خرق بتوقيت العلم والإبلاغ والسبب والحجم والأثر والإجراء التصحيحي.",
  ref:"ER Art. 5"},
 {id:"q32",s:"vendors",w:3,svc:"C3",
  en:"Do all vendors that handle personal data have data processing agreements?",
  ar:"هل لدى كل الموردين الذين يتعاملون مع البيانات الشخصية اتفاقيات معالجة بيانات؟",
  aen:"Sign processing agreements covering scope, security, audit, breach notice, deletion and sub-processors.",
  aar:"وقّع اتفاقيات معالجة تغطي النطاق والأمن والتدقيق والإبلاغ عن الخرق والمحو والمعالجين الفرعيين.",
  ref:"Law Art. 5; Data Users Guidelines"},
 {id:"q33",s:"vendors",w:2,svc:"C1",
  en:"Do you know where every system stores data, including SaaS and cloud services?",
  ar:"هل تعرف أين يخزن كل نظام البيانات، بما في ذلك الخدمات السحابية؟",
  aen:"Audit SaaS and cloud tools and keep a register of storage locations and transfers.",
  aar:"راجع الخدمات السحابية واحتفظ بسجل لأماكن التخزين وعمليات النقل.",
  ref:"Law Art. 14; ER Arts. 16, 24"},
 {id:"q34",s:"vendors",w:3,svc:"C1",when:p=>p.cloud,
  en:"For data stored or processed outside Egypt, do you have a transfer licence, a transfer impact assessment and consent where required?",
  ar:"للبيانات المخزنة أو المعالجة خارج مصر، هل لديك ترخيص نقل وتقييم لأثر النقل وموافقة حيث يلزم؟",
  aen:"Run a TIA per destination, collect consent where required and apply for the transfer licence naming each country.",
  aar:"أجرِ تقييمًا لأثر النقل لكل وجهة، واجمع الموافقة حيث يلزم، وتقدّم لترخيص النقل محددًا كل دولة.",
  ref:"Law Arts. 14–16, 42; ER Arts. 16–17, 24–27"},
 {id:"q35",s:"sens",w:3,svc:"A3",when:p=>p.sensitive,
  en:"For sensitive data (health, biometric, financial, religious, political, security), do you have written explicit consent and a licence covering it?",
  ar:"للبيانات الحساسة (صحية، حيوية، مالية، دينية، سياسية، أمنية)، هل لديك موافقة كتابية صريحة وترخيص يغطيها؟",
  aen:"Collect written consent (paper or electronic), limit data to what is essential and include sensitive data in the licence.",
  aar:"اجمع موافقة كتابية (ورقية أو إلكترونية)، واقصر البيانات على الأساسي، وأدرج البيانات الحساسة في الترخيص.",
  ref:"Law Arts. 12, 41; ER Art. 14"},
 {id:"q36",s:"sens",w:3,svc:"A3",when:p=>p.children,
  en:"For children’s data, do you have written guardian consent with a time scope, and do you avoid profiling or tracking children?",
  ar:"لبيانات الأطفال، هل لديك موافقة كتابية من ولي الأمر بنطاق زمني، وهل تتجنب تصنيف الأطفال أو تتبعهم؟",
  aen:"Collect guardian consent (written, with duration) for under-15s and guardian consent for 15–18; disable profiling.",
  aar:"اجمع موافقة ولي الأمر (كتابية ومحددة المدة) لمن هم دون 15 عامًا، وموافقته لمن بين 15 و18، وأوقف التصنيف.",
  ref:"Law Art. 12; ER Arts. 14(5), 15"},
 {id:"q37",s:"sens",w:2,svc:"C4",when:p=>p.sensitive||p.children||p.cctv,
  en:"Have you completed a data protection impact assessment (DPIA) for high-risk processing?",
  ar:"هل أجريت تقييم أثر حماية البيانات للمعالجة عالية المخاطر؟",
  aen:"Run a DPIA for sensitive data, children’s data, CCTV and new technology, and keep it for the PDPC.",
  aar:"أجرِ تقييم أثر للبيانات الحساسة وبيانات الأطفال وكاميرات المراقبة والتقنيات الجديدة، واحتفظ به للمركز.",
  ref:"Data Users Guidelines 3.7"},
 {id:"q38",s:"mkt",w:3,svc:"A7",when:p=>p.mkt,
  en:"Do you have prior explicit consent for marketing messages and a suppression list shared with all senders?",
  ar:"هل لديك موافقة صريحة مسبقة على الرسائل التسويقية وقائمة استبعاد مشتركة مع كل جهات الإرسال؟",
  aen:"Send marketing only to consenting contacts, keep a central suppression list and obtain the EDM licence.",
  aar:"أرسل التسويق فقط لمن وافقوا، واحتفظ بقائمة استبعاد مركزية، واحصل على ترخيص التسويق الإلكتروني.",
  ref:"Law Arts. 17, 43; ER Arts. 18, 29–30"},
 {id:"q39",s:"mkt",w:2,svc:"A7",when:p=>p.mkt,
  en:"Do messages show who created and sent them, include an opt-out of at most two steps, and are records kept for 3 years?",
  ar:"هل تُظهر الرسائل منشئها ومرسلها، وتتضمن إلغاء اشتراك بخطوتين على الأكثر، وتُحفظ السجلات 3 سنوات؟",
  aen:"Add standard footers with identity, contact and one-click opt-out; keep consent and campaign records 3 years.",
  aar:"أضف تذييلًا موحدًا بالهوية ووسيلة التواصل وإلغاء الاشتراك بنقرة، واحفظ سجلات الموافقة والحملات 3 سنوات.",
  ref:"Law Arts. 17–18; EDM Guidelines"},
 {id:"q40",s:"cctv",w:3,svc:"C2",when:p=>p.cctv,
  en:"Do you have a CCTV licence or permit, visible signage, facial recognition switched off, and footage kept in Egypt?",
  ar:"هل لديك ترخيص أو تصريح لكاميرات المراقبة، ولافتات ظاهرة، وتمييز الوجه متوقف، والتسجيلات داخل مصر؟",
  aen:"Apply for the CCTV licence (EGP 1,000 per 3 years) or permit (EGP 500 a year), add signage and disable facial recognition.",
  aar:"تقدّم لترخيص الكاميرات (1,000 جنيه لكل 3 سنوات) أو التصريح (500 جنيه سنويًا)، وضع لافتات، وأوقف تمييز الوجه.",
  ref:"ER Art. 31"},
 {id:"q41",s:"web",w:2,svc:"A6",when:p=>p.web,
  en:"Does your website use a cookie banner with non-essential cookies off by default, granular choices and stored preferences?",
  ar:"هل يستخدم موقعك شريط موافقة على الكوكيز مع إيقاف غير الضروري افتراضيًا وخيارات مفصلة وحفظ التفضيلات؟",
  aen:"Deploy a consent management tool that blocks non-essential tags until consent is given.",
  aar:"طبّق أداة لإدارة الموافقة تمنع الأدوات غير الضرورية حتى تُعطى الموافقة.",
  ref:"Compliance Checklist XI; EDM Guidelines"},
 {id:"q42",s:"web",w:1,svc:"A6",when:p=>p.web,
  en:"Is a privacy notice linked on every page, and do online forms collect only necessary fields?",
  ar:"هل إشعار الخصوصية مرتبط بكل صفحة، وهل تجمع النماذج الإلكترونية الحقول الضرورية فقط؟",
  aen:"Link the privacy notice in the footer and next to every form; remove optional fields you do not need.",
  aar:"أضف رابط إشعار الخصوصية في التذييل وبجوار كل نموذج، واحذف الحقول غير الضرورية.",
  ref:"Privacy Notice Guidelines; Compliance Checklist XI"},
 {id:"q43",s:"sec",w:2,svc:"B5",
  en:"Is every laptop, server and phone that touches personal data protected with endpoint detection, patch management and remote wipe?",
  ar:"هل كل حاسوب وخادم وهاتف يتعامل مع بيانات شخصية محمي برصد الأجهزة وإدارة التحديثات والمحو عن بعد؟",
  aen:"Deploy endpoint detection and response, a patch and vulnerability cycle, mobile device management with remote wipe and secure baselines.",
  aar:"طبّق حماية الأجهزة مع الرصد والاستجابة، ودورة للتحديثات والثغرات، وإدارة الأجهزة المحمولة مع المحو عن بعد، وإعدادات أمان قياسية.",
  ref:"Law Art. 5(7); ER Arts. 2 (second, 2), 4 (second, 1)"},
 {id:"q44",s:"sec",w:2,svc:"B3",
  en:"Do you control personal data leaving by email, web upload, USB or messaging (DLP, encrypted email, anti-phishing)?",
  ar:"هل تتحكم في خروج البيانات الشخصية عبر البريد أو الرفع على الويب أو USB أو المراسلة (منع تسرب البيانات، بريد مشفر، مكافحة التصيد)؟",
  aen:"Apply DLP policies keyed to data classification, encrypt sensitive email, control removable media and harden email against phishing and spoofing.",
  aar:"طبّق سياسات منع التسرب حسب تصنيف البيانات، وشفّر البريد الحساس، وتحكم في الوسائط القابلة للإزالة، وأمّن البريد ضد التصيد والانتحال.",
  ref:"Law Arts. 4(5), 5(5), 36, 41; ER Arts. 2(5), 3(9)"},
 {id:"q45",s:"sec",w:2,svc:"C4",
  en:"Do you run periodic vulnerability scans and penetration tests on systems that hold personal data?",
  ar:"هل تجري فحصًا دوريًا للثغرات واختبارات اختراق للأنظمة التي تحتوي على بيانات شخصية؟",
  aen:"Scan for vulnerabilities monthly, penetration-test external systems and critical applications yearly, and track remediation.",
  aar:"افحص الثغرات شهريًا، واختبر اختراق الأنظمة الخارجية والتطبيقات الحرجة سنويًا، وتابع المعالجة.",
  ref:"ER Art. 3 (second, 1); Data Users Guidelines 3.11"},
 {id:"q46",s:"sec",w:1,svc:"B8",when:p=>!p.cloud,
  en:"Are backups kept inside Egypt, with documented recovery objectives and a disaster recovery plan?",
  ar:"هل النسخ الاحتياطية محفوظة داخل مصر، مع أهداف استعادة موثقة وخطة للتعافي من الكوارث؟",
  aen:"Keep backup targets in Egypt (or hold a transfer licence), document recovery objectives and maintain a tested DR plan.",
  aar:"احتفظ بالنسخ الاحتياطية داخل مصر (أو احصل على ترخيص نقل)، ووثّق أهداف الاستعادة، واحتفظ بخطة تعافٍ مختبرة.",
  ref:"ER Arts. 3 (second, 4), 4 (second, 2), 35(10)"},
 {id:"q47",s:"vendors",w:2,svc:"C3",
  en:"Do you assess vendors before onboarding (security questionnaire, certifications) and re-assess high-risk vendors every year?",
  ar:"هل تقيّم الموردين قبل التعاقد (استبيان أمني، شهادات) وتعيد تقييم الموردين عاليي المخاطر سنويًا؟",
  aen:"Keep a vendor register linked to the RoPA, use a risk-tiered questionnaire, and run onboarding and offboarding checklists.",
  aar:"احتفظ بسجل موردين مرتبط بسجل المعالجة، واستخدم استبيانًا حسب المخاطر، وقوائم تحقق للتعاقد وإنهاء التعاقد.",
  ref:"Law Art. 5; Data Users Guidelines 2, 3.12"},
 {id:"q48",s:"gov",w:2,svc:"D1",
  en:"Is the infrastructure section of the licence file ready (data-centre classification, equipment, storage method, security certifications)?",
  ar:"هل قسم البنية التحتية في ملف الترخيص جاهز (تصنيف مركز البيانات، المعدات، طريقة التخزين، شهادات الأمن)؟",

function fee(n){ n=Math.max(0,Math.floor(+n||0)); if(n<=100000) return 0;
  if(n<=1000000) return Math.ceil(n/100000)*100;
  if(n<=2000000) return Math.ceil((n-1000000)/100000)*5000;
  if(n<=3000000) return 50000+Math.ceil((n-2000000)/100000)*10000;
  if(n<=4000000) return 150000+Math.ceil((n-3000000)/100000)*15000;
  if(n<=5000000) return 300000+Math.ceil((n-4000000)/100000)*20000;
  return 666666; }
const dpoCat=n=>{n=+n||0; return n<=100000?"C":n<=2000000?"B":"A";};
const applicable=()=>QUESTIONS.filter(q=>!q.when||q.when(S.profile));
const VAL={yes:1,partial:.5,no:0,unsure:0};

function renderStatic(){
  const t=L(); document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  document.title=t.brand+" — Alphavito";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t[el.dataset.t]; if(typeof v==="string") el.textContent=v;});
  $("lang").textContent=t.lang;
  const end=new Date("2026-11-01T00:00:00+02:00"), d=Math.ceil((end-new Date())/86400000);
  $("clock").innerHTML=d>0?t.daysLeft(d):t.ended;
  $("sector").innerHTML=t.sectors.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("");
  $("sector").value=S.profile.sector;
  $("role").innerHTML=[["both",t.roleBoth],["controller",t.roleC],["processor",t.roleP]].map(([v,l])=>`<label><input type="radio" name="role" value="${v}" ${S.profile.role===v?"checked":""}> ${esc(l)}</label>`).join("");
  $("toggles").innerHTML=Object.entries(t.tg).map(([k,[b,s]])=>`<label class="tg"><input type="checkbox" data-k="${k}" ${S.profile[k]?"checked":""}><span><b>${esc(b)}</b><span>${esc(s)}</span></span></label>`).join("");
  $("company").value=S.profile.company; $("records").value=S.profile.records;
  bankNote(); renderQs(); go(S.step,true);
}
function bankNote(){ $("bankNote").innerHTML=S.profile.sector==="bank"?`<div class="notice">${esc(L().bank)}</div>`:""; }
function renderQs(){
  const t=L(), qs=applicable(); let html="";
  SECTIONS.forEach(sec=>{ const items=qs.filter(q=>q.s===sec.id); if(!items.length) return;
    html+=`<div class="sec"><h2>${esc(sec[S.lang])}</h2>`+items.map(q=>{ const a=S.answers[q.id];
      return `<div class="q"><p>${esc(q[S.lang])}</p><div class="ans" role="group">`+["yes","partial","no","unsure"].map(v=>`<button type="button" data-q="${q.id}" data-v="${v}" aria-pressed="${a===v}">${t[v]}</button>`).join("")+`</div><div class="ref" dir="ltr">${esc(q.ref)}</div></div>`;}).join("")+`</div>`; });
  $("qs").innerHTML=html; progress();
}
function progress(){ const qs=applicable(), n=qs.filter(q=>S.answers[q.id]).length;
  $("pbar").style.width=(qs.length?n/qs.length*100:0)+"%"; $("ptext").textContent=L().answered(n,qs.length); }
function compute(){
  const qs=applicable(); let W=0,G=0; const bySec={};
  qs.forEach(q=>{ const v=VAL[S.answers[q.id]]??0; W+=q.w; G+=q.w*v; const b=bySec[q.s]||(bySec[q.s]={w:0,g:0}); b.w+=q.w; b.g+=q.w*v; });
  const gaps=qs.filter(q=>(VAL[S.answers[q.id]]??0)<1).sort((a,b)=>b.w-a.w||(VAL[S.answers[a.id]]??0)-(VAL[S.answers[b.id]]??0));
  const n=+S.profile.records||0, single=S.profile.role!=="both", f0=fee(n), f=single?Math.round(f0/2):f0;
  const lic=[L().lic.general+(S.profile.sensitive?" ("+L().lic.sensitive+")":"")];
  if(S.profile.cloud) lic.push(L().lic.transfer); if(S.profile.cctv) lic.push(L().lic.cctv); if(S.profile.mkt) lic.push(L().lic.edm);
  return {score:W?Math.round(G/W*100):0,bySec,gaps,fee:f,single,dpo:dpoCat(n),lic,unanswered:qs.filter(q=>!S.answers[q.id]).length};
}
function bandOf(s){ return s>=85?3:s>=60?2:s>=35?1:0; }
const tierOf=n=>{n=+n||0; return n<=100000?0:n<=2000000?1:2;};
function stackOf(p){ const n=+p.records||0; if(n>2000000) return "ent"; if(p.sensitive||p.children) return "local"; if(n<=100000) return "sme"; return p.cloud?"ms":"local"; }
// Tool column follows client size: large -> enterprise, medium -> mid-market, small -> low-cost.
const toolsFor=(svc,tier)=>TOOLS[svc]?TOOLS[svc][[2,1,0][tier]]:"";
function renderResults(){
  const t=L(), r=compute(), tier=tierOf(S.profile.records), b=bandOf(r.score), bc=["var(--no)","var(--partial)","var(--blue)","var(--blue)"][b];
  let h=`<div class="card"><div class="score"><div><div class="big" style="color:${bc}">${r.score}%</div><span class="band" style="background:var(--surface2);color:${bc}">${t.bands[b]}</span></div>
  <div><b>${esc(t.score)}${S.profile.company?" — "+esc(S.profile.company):""}</b>${r.unanswered?`<p class="empty" style="margin:6px 0 0">${esc(t.unanswered(r.unanswered))}</p>`:""}</div></div>
  <div class="facts">
   <div class="fact"><div class="k">${t.feeK}</div><div class="v">${r.fee?t.egp(r.fee):t.free}</div>${r.single&&r.fee?`<div class="k">${t.half}</div>`:""}</div>
   <div class="fact"><div class="k">${t.dpoK}</div><div class="v">${r.dpo}</div></div>
   <div class="fact"><div class="k">${t.licK}</div><div class="v" style="font-size:15px">${r.lic.map(esc).join("<br>")}</div></div>
   <div class="fact"><div class="k">${t.deadK}</div><div class="v">1 Nov 2026</div></div>
  </div></div>`;
  h+=`<h2 class="h">${t.bySection}</h2><div class="card"><div class="rows">`+SECTIONS.filter(s=>r.bySec[s.id]).map(s=>{const v=Math.round(r.bySec[s.id].g/r.bySec[s.id].w*100);
   return `<div class="row"><span>${esc(s[S.lang])}</span><div class="bar"><i style="width:${v}%;background:${v>=85?"var(--blue)":v>=50?"var(--partial)":"var(--no)"}"></i></div><b>${v}%</b></div>`;}).join("")+`</div></div>`;
  h+=`<h2 class="h">${t.plan}</h2>`;
  h+= r.gaps.length? r.gaps.map(q=>`<div class="act p${q.w}"><div class="meta"><span class="tag">${t.pr[q.w]}</span><span class="tag">${t.when[q.w]}</span><span class="tag">${esc(SECTIONS.find(s=>s.id===q.s)[S.lang])}</span></div>
   <p><b>${esc(S.lang==="ar"?q.aar:q.aen)}</b></p><p class="ref">${t.svc}: ${q.svc} ${esc(SERVICES[q.svc][S.lang])} · <span dir="ltr">${esc(q.ref)}</span></p>${toolsFor(q.svc,tier)?`<p class="ref">${t.toolsK}: <span dir="ltr">${esc(toolsFor(q.svc,tier))}</span></p>`:""}</div>`).join("") : `<p class="empty">${t.planNone}</p>`;
  if(r.gaps.length) h+=`<p class="fine" style="margin:8px 0 0">${esc(t.partner)}</p>`;
  const st=t.stacks[stackOf(S.profile)];
  h+=`<h2 class="h">${t.pkgH}</h2><div class="card"><p style="margin:0 0 12px"><b>${t.tierK}:</b> ${esc(t.tiers[tier])}</p><div class="rows">`+t.pkgRows.map(([k,v])=>`<div class="pkg"><b>${esc(k)}</b><span>${esc(v[tier])}</span></div>`).join("")+`</div>
   <p style="margin:16px 0 0"><b>${t.stackK}: ${esc(st[0])}</b></p><p class="empty" style="margin:4px 0 0">${esc(st[1])}</p></div>`;
  h+=`<h2 class="h">${t.leadH}</h2><form class="card" id="lead" novalidate><p style="margin:0 0 14px">${esc(t.leadP)}</p><div class="grid2">
   <label class="f"><span>${t.leadName}</span><input type="text" name="name" autocomplete="name" maxlength="120" required></label>
   <label class="f"><span>${t.leadEmail}</span><input type="email" name="email" autocomplete="email" maxlength="200" required dir="ltr"></label>
   <label class="f"><span>${t.leadPhone}</span><input type="tel" name="phone" autocomplete="tel" maxlength="40" dir="ltr"></label></div>
   <label class="tg" style="margin-top:14px"><input type="checkbox" name="consent" required><span>${esc(t.leadConsent)}</span></label>
   <div class="actions"><span id="leadmsg" class="empty" role="status"></span><button class="btn primary" type="submit">${t.leadSend}</button></div></form>`;
  h+=`<div class="actions"><span id="dlmsg" class="empty"></span><button class="btn primary" id="dl" type="button" hidden>${t.download}</button></div>`;
  $("results").innerHTML=h; setupDownload(r); setupLead(r);
}
function setupLead(r){ const f=$("lead"); if(!f) return; const msg=$("leadmsg");
  f.onsubmit=async e=>{ e.preventDefault(); const t=L(), d=Object.fromEntries(new FormData(f));
    if(!d.name.trim()||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())||!d.consent){ msg.textContent=t.leadInvalid; return; }
    const btn=f.querySelector("button"); btn.disabled=true; msg.textContent=t.leadSending;
    try{ const res=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:d.name.trim(),email:d.email.trim(),phone:(d.phone||"").trim(),consent:true,lang:S.lang,profile:S.profile,answers:S.answers,score:r.score,gaps:r.gaps.map(q=>q.id)})});
      if(!res.ok) throw new Error(res.status); msg.textContent=t.leadOk; f.querySelectorAll("input").forEach(i=>i.disabled=true); }
    catch(err){ msg.textContent=t.leadErr; btn.disabled=false; } };
}
let DL=null;
async function setupDownload(r){ const btn=$("dl"); if(!btn) return;
  if(DL===null&&window.claude&&window.claude.use){ try{ DL=await window.claude.use("downloads"); }catch(e){ DL=false; } }
  if(!DL){ btn.hidden=false; btn.onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([reportHTML(compute())],{type:"text/html"}));
    a.download="PDPL-readiness-report.html"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }; return; }
  btn.hidden=false;
  btn.onclick=async()=>{ try{ await DL.save({filename:"PDPL-readiness-report.html",data:new Blob([reportHTML(compute())],{type:"text/html"})}); }
   catch(e){ $("dlmsg").textContent = (e&&(e.code==="declined"))?"":(e&&(e.code==="unavailable"||e.code==="not_granted"))?L().dlNo:L().dlFail; } };
}
function reportHTML(r){ const t=L(), ar=S.lang==="ar", d=new Date().toISOString().slice(0,10);
  const rows=SECTIONS.filter(s=>r.bySec[s.id]).map(s=>`<tr><td>${esc(s[S.lang])}</td><td>${Math.round(r.bySec[s.id].g/r.bySec[s.id].w*100)}%</td></tr>`).join("");
  const acts=r.gaps.map(q=>`<tr><td>${t.pr[q.w]}</td><td>${t.when[q.w]}</td><td>${esc(ar?q.aar:q.aen)}</td><td dir="ltr">${q.svc} · ${esc(q.ref)}</td></tr>`).join("");
  return `<!doctype html><html lang="${S.lang}" dir="${ar?"rtl":"ltr"}"><head><meta charset="utf-8"><title>${t.reportTitle}</title><style>body{font-family:Arial,Tahoma,sans-serif;color:#14202C;max-width:900px;margin:30px auto;padding:0 20px;line-height:1.5}h1{color:#0B1F3A;border-bottom:3px solid #E03D00;padding-bottom:8px}table{border-collapse:collapse;width:100%;margin:10px 0 24px}th,td{border:1px solid #D7DFE8;padding:8px;text-align:start;vertical-align:top}th{background:#0B1F3A;color:#fff}.k{color:#56626E}</style></head><body>
  <h1>${t.reportTitle}</h1><p class="k">${esc(S.profile.company||"")} · ${t.generated}: ${d}</p>
  <h2>${t.score}: ${r.score}% — ${t.bands[bandOf(r.score)]}</h2>
  <table><tr><th>${t.feeK}</th><th>${t.dpoK}</th><th>${t.licK}</th><th>${t.deadK}</th></tr><tr><td>${r.fee?t.egp(r.fee):t.free}</td><td>${r.dpo}</td><td>${r.lic.map(esc).join("<br>")}</td><td>1 Nov 2026</td></tr></table>
  <h2>${t.bySection}</h2><table>${rows}</table>
  <h2>${t.plan}</h2>${r.gaps.length?`<table><tr><th>${t.pr[3].replace(/.*/,ar?"الأولوية":"Priority")}</th><th>${ar?"التوقيت":"Timing"}</th><th>${ar?"الإجراء":"Action"}</th><th>${t.ref}</th></tr>${acts}</table>`:`<p>${t.planNone}</p>`}
  <h2>${t.pkgH} — ${esc(t.tiers[tierOf(S.profile.records)])}</h2><table>${t.pkgRows.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v[tierOf(S.profile.records)])}</td></tr>`).join("")}</table>
  <p><b>${t.stackK}: ${esc(t.stacks[stackOf(S.profile)][0])}</b> — ${esc(t.stacks[stackOf(S.profile)][1])}</p>
  <p class="k">${t.fine}</p><p>Alphavito Technology Solutions · www.alphavito.com · Sales@alphavito.com · 01006527795</p></body></html>`; }
function go(i,quiet){ S.step=i; save(); document.querySelectorAll(".panel").forEach((p,k)=>p.classList.toggle("on",k===i));
  document.querySelectorAll(".step").forEach((b,k)=>b.setAttribute("aria-current",k===i?"step":"false"));
  if(i===1) renderQs(); if(i===2) renderResults(); if(!quiet) window.scrollTo({top:document.querySelector(".steps").offsetTop-10,behavior:"smooth"}); }
document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ go(+g.dataset.go); return; }
  const a=e.target.closest(".ans button"); if(a){ S.answers[a.dataset.q]=a.dataset.v; save();
    a.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===a)); progress(); } });
document.addEventListener("change",e=>{ const el=e.target;
  if(el.id==="sector"){S.profile.sector=el.value; bankNote();}
  else if(el.name==="role"){S.profile.role=el.value;}
  else if(el.dataset&&el.dataset.k){S.profile[el.dataset.k]=el.checked;}
  save(); });
document.addEventListener("input",e=>{ if(e.target.id==="company"){S.profile.company=e.target.value;save();} if(e.target.id==="records"){S.profile.records=e.target.value;save();} });
